<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us -- White Water Extreme</title>
    <meta name="description"
      content="This is the Contact Us page of the Rafting Company name. This contains the information for contacting white water rafting company.">
    <meta name="author" content="Madsen Wood">
    <link rel="stylesheet" href="styles/rafting.css">
</head>

<body>
    <header>
        <img src="images/white-water-rafting.png" alt="White Water Raftting">
        <nav>
            <a href="index.html">Home</a>
            <a href="about.html">About Us</a>
            <a href="trips.html">Trips</a>
            <a href="contact.html">Contact Us</a>
        </nav>
    </header>
    <main>
        <div class="hero">
            <h1>White Water Extreme</h1>
            <div class="contact">
                <p>123 Snake River Way</p>
                <p>Snake River, ID</p>
                <p>(123) 456-7890</p>
                <p>contact@whitewaterextreme.com</p>
            </div>
            <!-- <article class="contact">

            </article> -->
            <section class="reserve">
                <h2>Reservation Stuff</h2>
                <iframe
                  src="https://www.google.com/maps/embed?pb=!1m14!1m12!1m3!1d11742.92494542041!2d-114.51103884901039!3d42.62465569127361!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!5e0!3m2!1sen!2sus!4v1791003207211!5m2!1sen!2sus"
                  allowfullscreen="" loading="lazy"
                  referrerpolicy="strict-origin-when-cross-origin">
                </iframe>
                <form>
                    <div class="form-item">
                        <label for="name">Name</label>
                        <input type="text" name="name" id="name" placeholder="Johnny Appleseed">
                    </div>
                    <div class="form-item">
                        <label for="email">Email</label>
                        <input type="text" name="email" id="email" placeholder="john@appleseed.com">
                    </div>
                    <div class="form-item purpose">
                        <p>Message Purpose</p>
                        <label for="inquiry">General Inquiry</label>
                        <input type="radio" id="inquiry" name="purpose">
                        <label for="reservation">Reservation Question</label>
                        <input type="radio" id="reservation" name="purpose">
                        <label for="suggestion">Website Suggestion</label>
                        <input type="radio" id="suggestion" name="purpose">
                    </div>
                    <div class="form-item">
                        <label for="message">Message</label>
                        <textarea id="message" name="message" rows="4"
                          placeholder="Write your message here."></textarea>
                    </div>
                    <div class="form-item">
                        <label for="subscribe">Please subscribe me to the monthly newsletter</label>
                        <input type="checkbox" id="subscribe" name="subscribe">
                    </div>
                    <div class="form-item">
                        <button type="submit">Send Message</button>
                    </div>
                </form>
            </section>
            <section class="employee">
                <h2>We Are Here to Serve You</h2>
                <figure>
                    <img src="images/employees/iron-man.jpg" alt="Iron Man Employee">
                    <figcaption>Tony Stark - CEO</figcaption>
                </figure>
                <figure>
                    <img src="images/employees/batman.jpg" alt="Batman Employee">
                    <figcaption>Batman - Senior River Guide</figcaption>
                </figure>
                <figure>
                    <img src="images/employees/link-profile.jpg" alt="Link Employee">
                    <figcaption>Link - Junior River Guide</figcaption>
                </figure>
            </section>
        </div>
    </main>
    <footer>
        <p>&copy;2026 | White Water Extreme | Madsen Wood</p>
        <nav class="socialmedia">
            <a href="https://www.facebook.com/"><img src="images/facebook_725289.png"
                  alt="Facebook Icon"></a>
            <a href="https://www.instagram.com/"><img src="images/instagram_725278.png"
                  alt="Instagram Icon"></a>
            <a href="https://www.linkedin.com/"><img src="images/linkedin_794388.png"
                  alt="LinkedIn Icon"></a>
        </nav>
    </footer>
</body>

</html>
