<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz Form</title>
    <link rel="stylesheet" href="styles/quiz.css">
</head>

<body>
    <main>
        <h1>
            WDD 130 | Quiz Form | Madsen Wood
        </h1>
        <form class="box">
            <div class="quiz-item box">
                <label for="q1">What does the acronym CSS stand for?</label>
                <input type="text" name="q1" id="q1">
            </div>
            <div class="quiz-item box">
                <label for="q2">How are id and class attribute values selected in
                    CSS?</label>
                <input type="textarea" name="q2" id="q2">
            </div>
            <div class="quiz-item box">
                <label for="q3">Which of the following is a valid CSS comment?</label>
                <select name="q3" id="q3">
                    <option value="" selected disabled>Choose One...</option>
                    <option value="a">&lt;!--This is a comment--&gt;</option>
                    <option value="b">/* This is a comment */</option>
                    <option value="c"> // This is a comment</option>
                </select>
            </div>
            <div class="quiz-item box">
                <label for="q4">What is the bottom margin given in this declaration?</label>
                <code class="box">margin: 10px 5px 15px;</code>
                <input type="number" name="q4" id="q4">
            </div>
            <button type="submit">Submit Quiz</button>
        </form>
    </main>
</body>

</html>
